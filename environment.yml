# Conda equivalent of pyproject.toml, for anyone who prefers conda.
#
# `pip install -e .` still has to run afterwards to make `blindspot`
# importable -- setup.sh does both.
name: blindspot
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.26
  - pillow>=10
  - pip:
      - anthropic>=1.0.0
      # optional, only for `python -m blindspot.download`
      - datasets>=2.19
      - huggingface_hub>=0.23
